<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Listas</h1>
    <h2>Lista não Ordenada</h2>
    <ul>
        <li>Café</li>
        <li>Água</li>
        <li>Açucar</li>
        <li>Fogão</li>
    </ul>
    <h2>Lista Ordenada</h2>
    <ol>
        <li>Café</li>
        <li>Água</li>
        <li>Açucar</li>
        <li>Fogão</li>
    </ol>       
</body>
</html>
